<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · Gexoflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151b26'/%3E%3Cpath d='M7 21.5 C 11.5 21.5 13.5 16.5 16.5 16 C 19 15.5 21.5 11 25 11' fill='none' stroke='%23e7a44c' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='11' r='1.9' fill='%23e7a44c'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:#0a0d12;color:#e9edf4;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  }
  body::before{ /* 頂端很淡的琥珀光暈,營造深度但不搶戲 */
    content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);
    width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(231,164,76,.09),rgba(231,164,76,0) 62%);
    pointer-events:none;
  }
  .card{
    position:relative;width:100%;max-width:380px;
    background:#0e1219;border:1px solid rgba(255,255,255,.075);
    border-radius:16px;padding:44px 40px 36px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:34px}
  .mark svg{display:block}
  .word{font-size:27px;font-weight:700;letter-spacing:-.015em}
  .word b{font-weight:700;color:#e7a44c}
  .sub{font-size:12.5px;color:#8a93a4;letter-spacing:.02em}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:#8a93a4;margin-bottom:7px}
  .field input{
    width:100%;background:#131824;border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:11px 13px;color:#e9edf4;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus{border-color:#e7a44c;box-shadow:0 0 0 3px rgba(231,164,76,.14)}
  .field input::placeholder{color:#5a6472}
  .pwrap{position:relative}
  .pwrap input{padding-right:56px}
  .eye{position:absolute;top:50%;right:8px;transform:translateY(-50%);background:none;border:0;color:#8a93a4;font-size:12px;cursor:pointer;padding:4px 6px;font-family:inherit}
  .eye:hover{color:#e9edf4}
  .go{
    width:100%;margin-top:6px;padding:12px;border:0;border-radius:10px;cursor:pointer;
    background:#e7a44c;color:#16100a;font-size:14.5px;font-weight:650;font-family:inherit;
    transition:background .15s,transform .05s;
  }
  .go:hover{background:#f0b05c}
  .go:active{transform:translateY(1px)}
  .go:disabled{opacity:.6;cursor:default}
  .err{display:none;margin-top:14px;font-size:12.5px;color:#ff5c6c;text-align:center}
  .err.show{display:block}
  .foot{margin-top:28px;text-align:center;font-size:11px;color:#5a6472}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="mark">
        <svg width="52" height="52" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#151b26"/><path d="M7 21.5 C 11.5 21.5 13.5 16.5 16.5 16 C 19 15.5 21.5 11 25 11" fill="none" stroke="#e7a44c" stroke-width="2.6" stroke-linecap="round"/><circle cx="25" cy="11" r="1.9" fill="#e7a44c"/></svg>
      </div>
      <div class="word">Gexo<b>flow</b></div>
      <div class="sub">NQ GEX · Orderflow 監控台</div>
    </div>

    <form id="loginForm" method="post" action="/api/login" autocomplete="on">
      <div class="field">
        <label for="u">帳號</label>
        <input id="u" name="user" type="text" autocomplete="username" placeholder="你的帳號" required autofocus>
      </div>
      <div class="field">
        <label for="p">密碼</label>
        <div class="pwrap">
          <input id="p" name="pass" type="password" autocomplete="current-password" placeholder="你的密碼" required>
          <button type="button" id="eye" class="eye">顯示</button>
        </div>
      </div>
      <button class="go" id="go" type="submit">登入</button>
      <div class="err" id="err">帳號或密碼錯誤</div>
    </form>

    <div class="foot">私人交易工具 · 分析僅供參考,不構成投資建議</div>
  </div>

<script>
(function () {
  // 顯示密碼切換(選用功能,不影響登入)
  var eye = document.getElementById('eye'), p = document.getElementById('p');
  if (eye && p) {
    eye.addEventListener('click', function () {
      if (p.type === 'password') { p.type = 'text'; eye.textContent = '隱藏'; }
      else { p.type = 'password'; eye.textContent = '顯示'; }
    });
  }
  // 帳密錯誤時,伺服器會導回 /login?e=1,這裡把錯誤訊息顯示出來
  if (location.search.indexOf('e=1') !== -1 || location.search.indexOf('e=2') !== -1) {
    var err = document.getElementById('err');
    if (err) {
      err.textContent = location.search.indexOf('e=2') !== -1 ? '登入系統暫時無法使用,請稍後再試' : '帳號或密碼錯誤';
      err.classList.add('show');
    }
  }
})();
</script>
</body>
</html>
